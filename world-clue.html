<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Clue</title>
<style>
:root{
  --bg:#0f1117;--panel:#181b24;--panel2:#20242f;--text:#e9ecf2;--muted:#8b93a7;
  --green:#3a9d4f;--gold:#c79a22;--gray:#343a48;--accent:#e4b343;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--panel2);color:var(--text)}
button:hover:not(:disabled){filter:brightness(1.25)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1300;font-weight:600}
input{font:inherit;background:var(--panel2);color:var(--text);border:1px solid #2f3442;border-radius:8px;padding:10px 12px;width:100%}
a{color:var(--accent)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #232733;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;cursor:pointer}
.logo span{color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:560px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted)}
.bar b{color:var(--text)}
#status{color:var(--muted);min-height:20px;margin:6px 0}

/* flag board */
.flagbox{position:relative;width:100%;aspect-ratio:3/2;background:var(--panel);border-radius:12px;overflow:hidden;margin-bottom:12px;border:2px solid #232733}
.flagbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.covers{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.cover{background:var(--panel2);border:1px solid var(--bg);transition:opacity .5s}
.cover.open{opacity:0}
.flagbox .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:20px}

.searchwrap{position:relative}
#drop{position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid #2f3442;border-radius:8px;margin-top:4px;z-index:20;max-height:320px;overflow:auto;box-shadow:0 10px 30px #0008}
.opt{padding:8px 12px;cursor:pointer}
.opt.sel,.opt:hover{background:var(--panel2)}
.opt small{color:var(--muted)}

/* guess rows */
.grow{display:grid;grid-template-columns:1fr 90px 44px 64px;gap:6px;margin:6px 0;animation:flip .4s both;transform-origin:center top}
.grow>div{background:var(--gray);border-radius:8px;padding:9px 10px;display:flex;align-items:center;gap:8px;font-weight:600}
.grow>div:not(:first-child){justify-content:center}
.grow img{width:28px;height:19px;object-fit:cover;border-radius:3px;flex:none}
.grow.win>div{background:var(--green)}
.grow .pc.hot{background:var(--gold);color:#1a1300}
.grow.empty>div{background:var(--panel);color:var(--muted);font-weight:400}
.grow .arw{font-size:20px}
.noanim{animation:none}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:rotateX(0);opacity:1}}

/* country rows */
.crow{margin:10px 0 14px}
.rowhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.rowhead img{width:28px;height:19px;object-fit:cover;border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:var(--gray);border-radius:8px;min-height:68px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:flip .45s both;transform-origin:center top}
.tile.g{background:var(--green)}.tile.y{background:var(--gold);color:#1a1300}
.tile .lbl{font-size:10px;text-transform:uppercase;opacity:.75;margin-bottom:3px;letter-spacing:.5px}
.tile .val{font-weight:700;font-size:16px;word-break:break-word}
.tile.small .val{font-size:13px}
.arr{margin-left:4px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.chip{font-size:11px;font-weight:600;padding:2px 6px;border-radius:10px;background:#0003}
.chip.hit{background:#fff3;outline:1px solid #fff8}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.legend span{padding:3px 8px;border-radius:6px;font-size:13px;color:var(--text)}
@media (min-width:700px){main{max-width:720px}body[data-p=country] .tiles{grid-template-columns:1.3fr .9fr 1fr 1.4fr .9fr 1fr}}
.endcard{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:12px;padding:14px;margin:12px 0;border:2px solid var(--gray)}
.endcard.won{border-color:var(--green)}.endcard.lost{border-color:#a33}
.endcard img{width:72px;border-radius:6px}
.endcard h3{margin:0 0 8px;color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;position:relative}
.mbox h2{margin-top:0}
.mbox .close{position:absolute;right:10px;top:10px;background:none;font-size:22px}
.help{color:var(--muted);font-size:14px;line-height:1.5}
.stats{display:flex;gap:10px;text-align:center;margin-bottom:16px}
.stats div{flex:1;background:var(--panel2);border-radius:10px;padding:10px}
.stats b{display:block;font-size:24px}
.dist{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.dist .b{background:var(--green);padding:2px 6px;border-radius:4px;min-width:22px;text-align:right}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1a1300;padding:8px 14px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}

/* home + end screens */
.screen{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 0%,#1f2433 0%,var(--bg) 55%);overflow:auto;display:none;justify-content:center;align-items:flex-start;padding:36px 16px 40px}
.screen.on{display:flex}
.hwrap{width:100%;max-width:520px;text-align:center}
.hicon{font-size:54px;line-height:1}
.hlogo{font-size:44px;font-weight:800;letter-spacing:.5px;margin:6px 0 8px}.hlogo span{color:var(--accent)}
.hlogo.small{font-size:22px;margin:0 0 10px}
.tag{color:var(--muted);line-height:1.5;margin:0 0 20px}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;background:none;padding:10px 4px;font-size:14px}
.seg button.on{background:var(--accent);color:#1a1300;font-weight:700}
.seg button small{display:block;font-size:10px;opacity:.7}
.today{background:var(--panel);border:1px solid #2a2f3c;border-radius:14px;padding:14px 16px;margin-bottom:14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.today b{font-size:16px}.today .d{color:var(--muted);font-size:13px;margin-top:2px}.today .big{font-size:30px}
.hbtns{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.hbtns button{padding:14px;font-size:17px;border-radius:12px}
.hmini{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
.hmini button{padding:8px 14px;font-size:14px}
.hstats{display:flex;gap:8px;margin-bottom:16px}
.hstats div{flex:1;background:var(--panel);border-radius:10px;padding:8px;font-size:12px;color:var(--muted)}
.hstats b{display:block;font-size:20px;color:var(--text)}
.slabel{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px;text-align:left}
.back{color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:var(--accent)}
.endtitle{font-size:30px;font-weight:800;margin:0 0 4px}
.endart{width:240px;max-width:70vw;border-radius:10px;box-shadow:0 10px 30px #0008;margin:6px auto 14px;display:block}
.egrid{font-size:18px;line-height:1.3;margin:12px 0 16px;white-space:pre;overflow-x:auto}
@media (max-width:480px){.grow{grid-template-columns:1fr 76px 36px 52px}.grow>div{padding:8px 6px;font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="logo">World<span>Clue</span></div>

    <button id="bHome">⌂ Home</button>

  <div id="rows"></div>
</main>
<footer>Flag images from <a href="https://flagcdn.com" target="_blank">flagcdn.com</a>. Distances are between country centers. · <a href="index.html">All games</a></footer>
<div id="modal" hidden><div class="mbox"><button class="close" id="mclose">×</button><div id="mbody"></div></div></div>
<div id="toast"></div>

<section id="home" class="screen"><div class="hwrap">
  <div class="hicon">🗺️</div>
  <div class="hlogo">World<span>Clue</span></div>

  <div class="seg" id="hPuzzles">
    <button class="on" data-p="flag">🏳️ Flag</button>
    <button data-p="country">🔤 Country</button>
    <button disabled>🗾 Shape<small>soon</small></button>
    <button disabled>🔗 Border Hop<small>soon</small></button>
  </div>
  <div class="today" id="todayCard"></div>
  <div class="hbtns">
    <button class="primary" id="hDaily">Play today's flag</button>
    <button id="hUnl">Unlimited · random flags</button>
  </div>
  <div class="slabel">Daily</div>
  <div id="hStatsRow"></div>
  <div class="slabel">Unlimited</div>
  <div id="hUStatsRow"></div>
  <div class="hmini"><button id="hHow">How to play</button><button id="hStats">Stats</button></div>
  <a class="back" href="index.html">← All games</a>
</div></section>
<section id="endS" class="screen"><div class="hwrap" id="endBody"></div></section>

const PUZ = {
  flag: { max: 6, seed: 20261117, name: 'Flag', icon: '🏳️', noun: 'flag', nouns: 'flags',
    tag: 'Guess the country from a hidden flag in 6 tries. Each miss opens more of the flag and shows how far off you are.' },

};
let P = 'flag';
try { const s = localStorage.getItem('wc:puz'); if (s && PUZ[JSON.parse(s)]) P = JSON.parse(s); } catch (e) {}
const cfg = () => PUZ[P];

// ---------- helpers ----------
const TILES = 6;
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const K = s => `wc:${P}:${s}`;
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const pad = n => String(n).padStart(2, '0');
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayNum(key) { const [y, m, d] = key.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); }
function niceDate(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 1600); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, seed) {
  const r = mulberry32(seed), a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z ]/g, '').trim();
const flagUrl = (code, w) => `https://flagcdn.com/w${w}/${code}.png`;
function big(n) { if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M'; if (n >= 1e3) return Math.round(n / 1e3) + 'K'; return String(n); }

// ---------- geography ----------
const rad = d => d * Math.PI / 180;
function km(a, b) {
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return Math.round(6371 * 2 * Math.asin(Math.sqrt(h)));
}
function bearing(a, b) {
  const y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lng - a.lng));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const ARROWS = ['⬆️', '↗️', '➡️', '↘️', '⬇️', '↙️', '⬅️', '↖️'];
const arrow = deg => ARROWS[Math.round(deg / 45) % 8];
const proximity = d => Math.max(0, Math.round(100 - d / 20015 * 100)); // 20,015 km = half the world
function isWin(guess, ans) { return guess === ans || (P === 'flag' && TWINS[guess] === ans); }

// Flag puzzle: distance, arrow, closeness
function compare(code) {
  const g = BY[code], a = BY[game.answer];
  if (isWin(code, game.answer)) return { win: true, km: 0, arrow: '🎉', pct: 100 };
  const d = km(g, a);
  return { win: false, km: d, arrow: arrow(bearing(g, a)), pct: proximity(d) };
}
function squares(pct) { const full = Math.floor(pct / 20), half = full < 5 && pct % 20 >= 10 ? 1 : 0; return '🟩'.repeat(full) + '🟨'.repeat(half) + '⬛'.repeat(5 - full - half); }

// Country puzzle: six clue tiles. g = exact, y = close, x = no match. Arrow ↑ = answer is bigger.
function numTile(gv, av) {
  const ratio = Math.max(gv, av) / Math.max(1, Math.min(gv, av));
  return { cls: ratio <= 1.05 ? 'g' : ratio <= 1.5 ? 'y' : 'x', arrow: ratio <= 1.05 ? '' : av > gv ? '↑' : '↓' };
}
function countryTiles(code) {
  const g = BY[code], a = BY[game.answer], T = [];
  T.push({ label: 'Region', cls: g.sub === a.sub ? 'g' : g.cont === a.cont ? 'y' : 'x', val: esc(g.sub), small: true });
  const p = numTile(g.pop, a.pop);
  T.push({ label: 'People', cls: p.cls, val: big(g.pop) + `<span class="arr">${p.arrow}</span>` });
  const s = numTile(g.area, a.area);
  T.push({ label: 'Size', cls: s.cls, val: big(g.area) + ' km²' + `<span class="arr">${s.arrow}</span>` });
  const shared = g.langs.filter(l => a.langs.includes(l));
  const same = shared.length === g.langs.length && shared.length === a.langs.length;
  const chips = g.langs.slice(0, 3).map(l => `<span class="chip${a.langs.includes(l) ? ' hit' : ''}">${esc(l)}</span>`).join('') + (g.langs.length > 3 ? `<span class="chip">+${g.langs.length - 3}</span>` : '');
  T.push({ label: 'Languages', cls: same ? 'g' : shared.length ? 'y' : 'x', val: `<div class="chips">${chips || '—'}</div>` });
  T.push({ label: 'Coast', cls: g.land === a.land ? 'g' : 'x', val: g.land ? 'Landlocked' : 'Has coast', small: true });
  const d = km(g, a);
  T.push({ label: 'Distance', cls: d < 1500 ? 'y' : 'x', val: d.toLocaleString() + ' km' + `<span class="arr">${arrow(bearing(g, a))}</span>`, small: true });
  if (code === game.answer) T.forEach(t => { t.cls = 'g'; }), T[5].val = '🎉 Here';
  return T;
}
const EMO = { g: '🟩', y: '🟨', x: '⬛' };

// ---------- game ----------
let game = null, endDismissed = false;
function dailyAnswer(key) { const pool = shuffle(COUNTRIES.map(c => c.code).sort(), cfg().seed); return pool[dayNum(key) % pool.length]; }
function newGame(key, mode, answer) {
  // flag only: which tile opens at each step. Same order for everyone on a daily, random on unlimited.
  const seed = mode === 'daily' ? dayNum(key) * 7 + 3 : Math.floor(Math.random() * 1e9);
  return { p: P, key, mode, answer, order: shuffle([0, 1, 2, 3, 4, 5], seed), guesses: [], done: false, won: false };
}
function save() { LS.set(game.mode === 'unlimited' ? K('unl') : K('g:' + game.key), game); }

function startDaily(key) {
  hideHome();
  const answer = dailyAnswer(key), saved = LS.get(K('g:' + key), null);
  game = saved && saved.answer === answer ? saved : newGame(key, 'daily', answer);
  loadGame();
}
function startUnlimited(fresh) {
  hideHome();
  let saved = LS.get(K('unl'), null);
  if (!saved || fresh) {
    const last = saved && saved.answer;
    let pick;
    do pick = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)].code; while (pick === last);
    saved = newGame('unl', 'unlimited', pick);
  }
  game = saved; save();
  loadGame();
}
function loadGame() {
  endDismissed = false;
  document.body.dataset.p = P;
  $('#rows').innerHTML = '';
  if (P === 'flag') {
    $('#flagbox').hidden = false;
    $('#flagbox').innerHTML = `<img id="flagImg" alt="Mystery flag" src="${flagUrl(game.answer, 640)}"><div class="covers">${Array.from({ length: TILES }, (_, i) => `<div class="cover" data-i="${i}"></div>`).join('')}</div>`;
    $('#flagImg').onerror = () => { $('#flagbox').innerHTML = '<div class="err">The flag picture would not load. Check your internet and reload.</div>'; };
  } else { $('#flagbox').hidden = true; $('#flagbox').innerHTML = ''; }
  renderRows(false);
  renderMeta();
  if (!game.done) setTimeout(() => $('#q').focus(), 50);
}
function openTiles() {
  if (P !== 'flag') return;
  const n = game.done ? TILES : Math.min(TILES, 1 + game.guesses.length);
  const open = new Set(game.order.slice(0, n));
  document.querySelectorAll('.cover').forEach(c => c.classList.toggle('open', open.has(+c.dataset.i)));
}
function flagRow(code, animate) {
  const c = BY[code], r = compare(code);
  return `<div class="grow${r.win ? ' win' : ''}${animate ? '' : ' noanim'}">
    <div><img src="${flagUrl(code, 40)}" alt="">${esc(c.name)}</div>
    <div>${r.win ? '✓' : r.km.toLocaleString() + ' km'}</div>
    <div class="arw">${r.arrow}</div>
    <div class="pc${!r.win && r.pct >= 90 ? ' hot' : ''}">${r.pct}%</div></div>`;
}
function countryRow(code, animate) {
  const c = BY[code];
  const tiles = countryTiles(code).map((t, i) => `<div class="tile ${t.cls}${t.small ? ' small' : ''}${animate ? '' : ' noanim'}"${animate ? ` style="animation-delay:${i * 0.15}s"` : ''}><div class="lbl">${t.label}</div><div class="val">${t.val}</div></div>`).join('');
  return `<div class="crow"><div class="rowhead"><img src="${flagUrl(code, 40)}" alt="">${esc(c.name)}</div><div class="tiles">${tiles}</div></div>`;
}
function renderRows(animateLast) {
  const g = game.guesses, max = cfg().max;
  if (P === 'flag') {
    let html = g.map((code, i) => flagRow(code, animateLast && i === g.length - 1)).join('');
    if (!game.done) for (let i = g.length; i < max; i++) html += '<div class="grow empty noanim"><div>&nbsp;</div><div></div><div></div><div></div></div>';
    $('#rows').innerHTML = html;
  } else {
    // newest guess on top, like Reel Clue
    $('#rows').innerHTML = g.map((code, i) => countryRow(code, animateLast && i === g.length - 1)).reverse().join('');
  }
}

function guess(code) {
  if (!game || game.done || !BY[code]) return;
  if (game.guesses.includes(code)) { toast('Already guessed that one'); return; }
  game.guesses.push(code);
  if (isWin(code, game.answer)) { game.done = true; game.won = true; }
  else if (game.guesses.length >= cfg().max) game.done = true;
  save();
  if (game.done) recordStat();
  renderRows(true);
  renderMeta();
}

function renderMeta() {
  const today = dateKey(new Date()), c = cfg();
  $('#modeLbl').innerHTML = game.mode === 'unlimited' ? `<b>Unlimited</b> · ${c.name}` : `<b>${game.key === today ? 'Daily' : 'Past'} ${c.noun}</b> · ${niceDate(game.key)}`;
  $('#count').textContent = game.guesses.length;
  $('#maxG').textContent = c.max;
  $('#q').disabled = game.done;
  $('#q').placeholder = game.done ? 'Game over' : 'Type a country…';
  openTiles();
  renderEnd();
}

function emojiRows() {
  if (P === 'flag') return game.guesses.map(code => { const r = compare(code); return r.win ? '🟩🟩🟩🟩🟩 🎉' : squares(r.pct) + ' ' + r.arrow; });
  return game.guesses.map(code => countryTiles(code).map(t => EMO[t.cls]).join(''));
}
function shareText() {
  const c = cfg(), label = game.mode === 'unlimited' ? 'Unlimited' : game.key;
  return `World Clue ${c.icon} ${c.name} ${label} ${game.won ? game.guesses.length : 'X'}/${c.max}\n` + emojiRows().join('\n');
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copied!');
}

function renderEnd() {
  const box = $('#end');
  if (!game.done) { box.hidden = true; $('#endS').classList.remove('on'); return; }
  const a = BY[game.answer], c = cfg();
  box.hidden = false;
  box.innerHTML = `<div class="endcard ${game.won ? 'won' : 'lost'}"><img src="${flagUrl(a.code, 160)}" alt="">
    <div><h3>${esc(a.name)}</h3><div class="btns"><button class="primary" id="sumBtn">Show summary</button>${game.mode === 'unlimited' ? `<button id="nextBtn2">Next ${c.noun} →</button>` : ''}<button id="homeBtn2">⌂ Home</button></div></div></div>`;
  $('#sumBtn').onclick = openEnd;
  $('#homeBtn2').onclick = showHome;
  if ($('#nextBtn2')) $('#nextBtn2').onclick = () => startUnlimited(true);
  if (!endDismissed) setTimeout(openEnd, P === 'flag' ? 700 : 1300);
}
function openEnd() {
  if (!game || !game.done) return;
  const a = BY[game.answer], n = game.guesses.length, daily = game.mode !== 'unlimited', c = cfg();
  $('#endBody').innerHTML = `
    <div class="hlogo small">World<span>Clue</span></div>
    <p class="endtitle">${game.won ? `Got it in ${n}! 🎉` : 'Out of guesses'}</p>
    <p class="tag" style="margin-bottom:8px">${daily ? `Daily ${c.noun} · ` + niceDate(game.key) : `Unlimited ${c.noun}`}</p>
    <img class="endart" src="${flagUrl(a.code, 640)}" alt="">
    <h2 style="margin:0 0 6px">${esc(a.name)}</h2>
    <p class="tag" style="font-size:14px;margin-bottom:6px">Capital ${esc(a.capital || '—')} · ${big(a.pop)} people · ${big(a.area)} km² · ${esc(a.sub)}</p>
    <div class="egrid">${emojiRows().join('\n')}</div>
    ${daily ? statsRow() : uStatsRow()}
    <div class="hbtns">
      ${daily ? '' : `<button class="primary" id="eNext">Next ${c.noun} →</button>`}
      <button ${daily ? 'class="primary"' : ''} id="eShare">Copy result</button>
      <button id="eBoard">View my guesses</button>
      <button id="eHome">⌂ Back to home</button>
    </div>`;
  $('#eShare').onclick = () => copy(shareText());
  if ($('#eNext')) $('#eNext').onclick = () => startUnlimited(true);
  $('#eBoard').onclick = () => { endDismissed = true; $('#endS').classList.remove('on'); };
  $('#eHome').onclick = showHome;
  $('#endS').classList.add('on'); $('#endS').scrollTop = 0;
}

// ---------- stats (kept per puzzle) ----------
function uStats() { return Object.assign({ played: 0, wins: 0, streak: 0, best: 0, dist: Array(cfg().max).fill(0) }, LS.get(K('ustats'), {})); }
function recordStat() {
  if (game.mode === 'unlimited') {
    const u = uStats();
    u.played++;
    if (game.won) { u.wins++; u.streak++; u.best = Math.max(u.best, u.streak); u.dist[game.guesses.length - 1]++; } else u.streak = 0;
    LS.set(K('ustats'), u);
  } else {
    const s = LS.get(K('stats'), {});
    if (!(game.key in s)) { s[game.key] = game.won ? game.guesses.length : 0; LS.set(K('stats'), s); }
  }
}
function streakOf(s) { let n = 0; const d = new Date(); if (!(dateKey(d) in s)) d.setDate(d.getDate() - 1); while (s[dateKey(d)] > 0) { n++; d.setDate(d.getDate() - 1); } return n; }
function row3(a, b, c) { return `<div class="hstats"><div><b>${a[0]}</b>${a[1]}</div><div><b>${b[0]}</b>${b[1]}</div><div><b>${c[0]}</b>${c[1]}</div></div>`; }
const pctOf = (w, p) => (p ? Math.round(w / p * 100) : 0) + '%';
function statsRow() {
  const s = LS.get(K('stats'), {}), v = Object.values(s), wins = v.filter(x => x > 0).length;
  return row3([v.length, 'Played'], [pctOf(wins, v.length), 'Win rate'], [streakOf(s), 'Streak']);
}
function uStatsRow() { const u = uStats(); return row3([u.played, 'Played'], [pctOf(u.wins, u.played), 'Win rate'], [u.streak + ' / ' + u.best, 'Streak / best']); }
function distHtml(dist) {
  const mx = Math.max(1, ...dist);
  return dist.map((c, i) => `<div class="dist"><span style="width:16px">${i + 1}</span><span class="b" style="width:${Math.max(6, c / mx * 100)}%">${c}</span></div>`).join('');
}
function openStats() {
  const s = LS.get(K('stats'), {}), dist = Array(cfg().max).fill(0);
  Object.values(s).forEach(v => { if (v > 0) dist[v - 1]++; });
  const u = uStats();
  openModal(`<h2>${cfg().name} stats</h2>
  <div class="help">Daily</div>${statsRow()}<div class="help">Guess distribution</div>${distHtml(dist)}
  <div class="help" style="margin-top:16px">Unlimited</div>${uStatsRow()}<div class="help">Guess distribution</div>${distHtml(u.dist)}`);
}
function openHelp() {
  const daily = `<p><b>Daily</b> is the same for everyone and changes at midnight. <b>Unlimited</b> gives a random one any time, with its own stats.</p>`;
  if (P === 'flag') openModal(`<h2>How to play · Flag</h2><div class="help">
  <p>A mystery flag is hidden under 6 tiles. One tile starts open. Guess the country in <b>6 tries</b>.</p>
  <p>Each wrong guess opens one more tile and shows:</p>
  <ul><li><b>Distance</b> from your guess to the answer.</li>
  <li><b>Arrow</b> pointing the way to the answer.</li>
  <li><b>Closeness</b> from 0% on the other side of the world to 100% right on it.</li></ul>
  <p>Distances run between the middle of each country, so neighbors can still look far apart.</p>${daily}</div>`);
  else openModal(`<h2>How to play · Country</h2><div class="help">
  <p>Guess the mystery country in <b>8 tries</b>. Each guess flips 6 tiles comparing it to the answer.</p>
  <div class="legend"><span style="background:var(--green)">Green = match</span><span style="background:var(--gold);color:#1a1300">Gold = close</span><span style="background:var(--gray)">Gray = no</span></div>
  <ul><li><b>Region</b>: green if same region, gold if same continent.</li>
  <li><b>People</b> and <b>Size</b>: gold if within half again. ↑ means the answer is bigger.</li>
  <li><b>Languages</b>: green if the same set, gold if any are shared. Shared ones are lit up.</li>
  <li><b>Coast</b>: does it touch the sea?</li>
  <li><b>Distance</b>: how far and which way. Gold if under 1,500 km.</li></ul>${daily}</div>`);
}
function openModal(html) { $('#mbody').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
$('#mclose').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
$('#bHome').onclick = showHome;
$('.logo').onclick = showHome;
$('#bStats').onclick = openStats;
$('#bHelp').onclick = openHelp;

// ---------- home ----------
function showHome() { $('#endS').classList.remove('on'); renderHome(); $('#home').classList.add('on'); $('#home').scrollTop = 0; }
function hideHome() { $('#home').classList.remove('on'); $('#endS').classList.remove('on'); }
function renderHome() {
  const c = cfg(), today = dateKey(new Date()), g = LS.get(K('g:' + today), null);
  document.querySelectorAll('#hPuzzles button[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === P));
  $('#hTag').textContent = c.tag;
  let status, icon = c.icon, label;
  if (!g || !g.guesses.length) { status = `<b>Today's ${c.noun} is waiting</b><div class="d">${niceDate(today)} · not played yet</div>`; label = `Play today's ${c.noun}`; }
  else if (!g.done) { status = `<b>In progress · ${g.guesses.length}/${c.max} guesses</b><div class="d">${niceDate(today)}</div>`; icon = '⏳'; label = 'Continue today'; }
  else { status = `<b>${g.won ? `Solved in ${g.guesses.length}` : 'Missed today'}</b><div class="d">${niceDate(today)} · come back tomorrow</div>`; icon = g.won ? '✅' : '❌'; label = "See today's result"; }
  $('#todayCard').innerHTML = `<div>${status}</div><div class="big">${icon}</div>`;
  $('#hDaily').textContent = label;
  $('#hStatsRow').innerHTML = statsRow();
  $('#hUStatsRow').innerHTML = uStatsRow();
  const u = LS.get(K('unl'), null);
  $('#hUnl').textContent = u && !u.done && u.guesses.length ? `Continue unlimited · ${u.guesses.length}/${c.max}` : `Unlimited · random ${c.nouns}`;
}
document.querySelectorAll('#hPuzzles button[data-p]').forEach(b => b.onclick = () => { P = b.dataset.p; LS.set('wc:puz', P); renderHome(); });
$('#hDaily').onclick = () => startDaily(dateKey(new Date()));
$('#hUnl').onclick = () => startUnlimited(false);
$('#hHow').onclick = openHelp;
$('#hStats').onclick = openStats;

// ---------- search ----------
let sel = -1, results = [];
const q = $('#q'), drop = $('#drop');
function search(v) {
  const n = norm(v); if (!n) return [];
  const score = c => {
    const names = [c.name, ...c.aka].map(norm);
    if (names.some(x => x === n)) return 0;
    if (names.some(x => x.startsWith(n))) return 1;
    if (names.some(x => x.split(' ').some(w => w.startsWith(n)))) return 2;
    if (n.length >= 3 && names.some(x => x.includes(n))) return 3;
    return 9;
  };
  return COUNTRIES.map(c => [score(c), c]).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).slice(0, 8).map(x => x[1]);
}
q.addEventListener('input', () => { results = search(q.value); sel = results.length ? 0 : -1; renderDrop(); });
function renderDrop() {
  if (!q.value.trim()) { drop.hidden = true; return; }
  if (!results.length) { drop.innerHTML = '<div class="opt"><small>No matches</small></div>'; drop.hidden = false; return; }
  drop.innerHTML = results.map((c, i) => `<div class="opt ${i === sel ? 'sel' : ''}" data-i="${i}">${esc(c.name)}${game && game.guesses.includes(c.code) ? ' <small>· guessed</small>' : ''}</div>`).join('');
  drop.hidden = false;
  drop.querySelectorAll('.opt[data-i]').forEach(o => o.onmousedown = e => { e.preventDefault(); pick(+o.dataset.i); });
}
function pick(i) { const c = results[i]; if (!c) return; q.value = ''; drop.hidden = true; results = []; guess(c.code); }
q.addEventListener('keydown', e => {
  if (drop.hidden || !results.length) return;
  if (e.key === 'ArrowDown') { sel = (sel + 1) % results.length; renderDrop(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = (sel - 1 + results.length) % results.length; renderDrop(); e.preventDefault(); }
  else if (e.key === 'Enter') { pick(sel); e.preventDefault(); }
  else if (e.key === 'Escape') drop.hidden = true;
});
q.addEventListener('blur', () => setTimeout(() => drop.hidden = true, 150));

// ---------- init ----------
showHome();
</script>
</body>
</html>
