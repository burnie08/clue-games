<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tune Clue</title>
<style>
:root{--bg:#0f1117;--panel:#181b24;--panel2:#20242f;--text:#e9ecf2;--muted:#8b93a7;--green:#3a9d4f;--gold:#c79a22;--red:#b8423f;--gray:#343a48;--accent:#e4b343}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--panel2);color:var(--text)}
button:hover:not(:disabled){filter:brightness(1.25)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1300;font-weight:600}
input,select,textarea{font:inherit;background:var(--panel2);color:var(--text);border:1px solid #2f3442;border-radius:8px;padding:10px 12px;width:100%}
a{color:var(--accent)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #232733;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}.logo span{color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{padding:8px 12px}
nav button.on{background:var(--accent);color:#1a1300}
main{max-width:640px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:12px}.bar b{color:var(--text)}
#status{color:var(--muted);min-height:20px;margin:6px 0;text-align:center}
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.slot{height:42px;border:1px solid #2f3442;border-radius:8px;display:flex;align-items:center;padding:0 12px;gap:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.cur{border-color:var(--accent)}
.slot.skip{color:var(--muted)}
.slot.wrong{color:var(--text);border-color:var(--red)}
.slot.artist{color:var(--text);border-color:var(--gold)}
.slot.correct{color:var(--text);border-color:var(--green);background:#3a9d4f33}
.slot .ic{font-weight:700;width:18px;flex:none}
.slot.wrong .ic{color:var(--red)}.slot.artist .ic{color:var(--gold)}.slot.correct .ic{color:var(--green)}
.player{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.track{position:relative;height:14px;background:#0b0d12;border-radius:7px;overflow:hidden}
.unl{position:absolute;left:0;top:0;bottom:0;background:#3d4457}
.prog{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
#play{width:64px;height:64px;border-radius:50%;font-size:24px;background:var(--accent);color:#1a1300;padding:0}
.vol{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.vol input{width:90px;padding:0}
.searchwrap{position:relative}
#drop{position:absolute;left:0;right:0;bottom:100%;background:var(--panel);border:1px solid #2f3442;border-radius:8px;margin-bottom:4px;z-index:20;max-height:330px;overflow:auto;box-shadow:0 -10px 30px #0008}
.opt{padding:9px 12px;cursor:pointer}.opt small{color:var(--muted)}
.opt.sel,.opt:hover{background:var(--panel2)}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.endcard{display:flex;gap:16px;background:var(--panel);border-radius:12px;padding:16px;margin:12px 0;border:2px solid var(--gray);align-items:center}
.endcard.won{border-color:var(--green)}.endcard.lost{border-color:var(--red)}
.endcard img{width:120px;height:120px;border-radius:8px;flex:none}
.endcard h2{margin:0 0 4px}.endcard h3{margin:0;color:var(--accent)}
.endcard p{color:var(--muted);margin:4px 0 10px}
.btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;position:relative}
.mbox h2{margin-top:0}.mbox .close{position:absolute;right:10px;top:10px;background:none;font-size:22px}
.mbox label{display:block;margin:12px 0 4px;color:var(--muted);font-size:13px}
.help{color:var(--muted);font-size:13px;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;margin:0;background:var(--panel2);padding:6px 10px;border-radius:8px;color:var(--text)}
.checks input{width:auto}
.stats{display:flex;gap:10px;text-align:center;margin-bottom:16px}
.stats div{flex:1;background:var(--panel2);border-radius:10px;padding:10px}.stats b{display:block;font-size:24px}
.dist{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.dist .b{background:var(--green);padding:2px 6px;border-radius:4px;min-width:22px;text-align:right}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.days button{text-align:left;font-size:13px;padding:8px}.days button small{display:block;color:var(--muted)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#1a1300;padding:8px 14px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
@media (max-width:520px){.endcard{flex-direction:column;text-align:center}.btns{justify-content:center}}
</style>
</head>

<header>
  <div class="logo">Tune<span>Clue</span></div>
  <nav>
    <button id="bDaily" class="on">Daily</button>
    <button id="bUnl">Unlimited</button>
    <button id="bReplay">Replay</button>
    <button id="bStats">Stats</button>
    <button id="bHelp">?</button>

<main>

  <div id="end" hidden></div>
  <div class="player">

    <div class="times"><span id="tNow">0:00</span><span id="tMax">0:16</span></div>
    <div class="controls">
      <div class="vol">🔈<input type="range" id="vol" min="0" max="1" step="0.05"></div>
      <button id="play" title="Play">▶</button>
      <div class="vol" style="visibility:hidden">🔈<input type="range"></div>
    </div>
  </div>
  <div id="status"></div>
  <div id="guessArea">
    <div class="searchwrap">
      <input id="q" placeholder="Know it? Search for the artist / title" autocomplete="off">
      <div id="drop" hidden></div>
    </div>
    <div class="actions"><button id="skip">Skip</button><button id="submit" class="primary">Submit</button></div>
  </div>
</main>
<footer>Song previews courtesy of Apple Music / iTunes. Personal use. · <a href="reel-clue.html">Play Reel Clue</a></footer>
<div id="modal" hidden><div class="mbox"><button class="close" id="mclose">×</button><div id="mbody"></div></div></div>

// ---------- helpers ----------
const CLIPS = [1, 2, 4, 7, 11, 16];

  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const pad = n => String(n).padStart(2, '0');
function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayNum(k) { const [y, m, d] = k.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); }
function niceDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function norm(s) {
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/ - .*$/, '').replace(/&/g, ' and ')
    .replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
}
function artistParts(a) { return String(a).split(/,| feat\.? | ft\. | x /i).map(norm).filter(Boolean); }

// ---------- settings & pool ----------

function parseCustom(txt) {
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(' - '); if (i < 0) return null;
    return { era: 'custom', artist: l.slice(0, i).trim(), title: l.slice(i + 3).trim() };
  }).filter(Boolean);
}
function getPool() {
  if (settings.useCustom) { const c = parseCustom(settings.custom); if (c.length) return c; }
  const p = BUILTIN.filter(s => settings.eras.includes(s.era));
  return p.length ? p : BUILTIN;
}
let POOL = getPool();
function shuffledPool() {
  const a = POOL.slice().sort((x, y) => songKey(x) < songKey(y) ? -1 : 1), r = mulberry32(42);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function poolSig() { return settings.useCustom && parseCustom(settings.custom).length ? 'c' + parseCustom(settings.custom).length : settings.eras.slice().sort().join(','); }

// ---------- iTunes (JSONP so it works from a local file) ----------

function itunes(term) {
  return new Promise((res, rej) => {
    const cb = '__itc' + (++jn), s = document.createElement('script');
    const u = new URL('https://itunes.apple.com/search');
    Object.entries({ term, media: 'music', entity: 'song', limit: 15, country: settings.country, callback: cb }).forEach(([k, v]) => u.searchParams.set(k, v));
    const t = setTimeout(() => { done(); rej(new Error('iTunes timed out')); }, 12000);
    function done() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error('Could not reach iTunes')); };
    s.src = u.toString(); document.head.appendChild(s);
  });
}
async function resolveTrack(song) {
  const ck = 'tc:t:' + settings.country + ':' + songKey(song);
  const c = LS.get(ck, null); if (c) return c;
  const d = await itunes(song.artist.replace(/,/g, ' ') + ' ' + song.title.replace(/[()]/g, ''));
  const nt = norm(song.title), na = artistParts(song.artist);
  const rs = (d.results || []).filter(r => r.previewUrl);
  const ok = r => { const rt = norm(r.trackName); return (rt === nt || rt.startsWith(nt) || nt.startsWith(rt)) && artistParts(r.artistName).some(p => na.includes(p) || na.some(x => p.includes(x))); };
  const best = rs.find(r => ok(r) && !/karaoke|tribute|cover|instrumental/i.test(r.artistName + r.collectionName)) || rs.find(ok);
  if (!best) return null;
  const t = { preview: best.previewUrl, art: (best.artworkUrl100 || '').replace('100x100', '300x300'), name: best.trackName, artist: best.artistName, year: (best.releaseDate || '').slice(0, 4), url: best.trackViewUrl };
  LS.set(ck, t); return t;
}

// ---------- game ----------
let game = null, answer = null, track = null, selected = null;
const au = $('#au');
au.volume = settings.vol; $('#vol').value = settings.vol;
$('#vol').oninput = e => { au.volume = +e.target.value; settings.vol = au.volume; LS.set('tc:settings', settings); };

function save() { LS.set('tc:g:' + game.key, game); }
function fresh(key, mode, song) { return { key, mode, song, sig: poolSig(), guesses: [], done: false, won: false }; }

async function startDaily(key) {
  stopAudio();
  const saved = LS.get('tc:g:' + key, null);
  if (saved && saved.sig === poolSig()) { game = saved; }
  else {
    const list = shuffledPool();
    game = fresh(key, 'daily', null);
    // find a song with an available preview, starting at today's slot
    setStatus('Finding today\'s song…');
    for (let i = 0; i < 6; i++) {
      const s = list[(dayNum(key) + i * 7) % list.length];
      if (await resolveTrack(s).catch(() => null)) { game.song = s; break; }
    }
    if (!game.song) { setStatus('Couldn\'t load a song from iTunes. Check your connection and refresh.'); return; }
  }
  setNav(key === dateKey(new Date()) ? 'bDaily' : 'bReplay');
  await loadGame();
}
async function startUnlimited(newOne) {
  stopAudio();
  let saved = LS.get('tc:g:unl', null);
  if (!saved || newOne) {
    setStatus('Picking a song…');
    saved = null;
    for (let i = 0; i < 6 && !saved; i++) {
      const s = POOL[Math.floor(Math.random() * POOL.length)];
      if (await resolveTrack(s).catch(() => null)) saved = fresh('unl', 'unlimited', s);
    }
    if (!saved) { setStatus('Couldn\'t load a song from iTunes.'); return; }
  }
  game = saved; save(); setNav('bUnl');
  await loadGame();
}
async function loadGame() {
  answer = game.song;
  setStatus('Loading clip…');
  try { track = await resolveTrack(answer); } catch (e) { track = null; }
  if (!track) { setStatus('This song has no preview available. Try Unlimited or another day.'); return; }
  au.src = track.preview; au.load();
  setStatus(''); selected = null; $('#q').value = '';
  render();
}
function limit() { return game.done ? 30 : CLIPS[Math.min(game.guesses.length, MAXT - 1)]; }

function render() {
  const today = dateKey(new Date());
  $('#modeLbl').innerHTML = game.mode === 'unlimited' ? '<b>Unlimited</b>' : `<b>${game.key === today ? 'Daily' : 'Replay'}</b> · ${niceDate(game.key)}`;
  $('#count').textContent = Math.min(game.guesses.length + 1, MAXT);
  // slots
  const box = $('#slots'); box.innerHTML = '';
  for (let i = 0; i < MAXT; i++) {
    const g = game.guesses[i];
    const cls = g ? g.type : (i === game.guesses.length && !game.done ? 'cur' : '');
    const ic = g ? { skip: '–', wrong: '✗', artist: '≈', correct: '✓' }[g.type] : '';
    const txt = g ? (g.type === 'skip' ? 'Skipped' : esc(g.label) + (g.type === 'artist' ? ' <small style="color:var(--gold)">· right artist</small>' : '')) : '';
    box.appendChild(el('div', 'slot ' + cls, `<span class="ic">${ic}</span><span>${txt}</span>`));
  }
  // track bar
  const L = limit(), scale = game.done ? 30 : 16;
  const tr = $('#track'); tr.querySelectorAll('.tick').forEach(t => t.remove());
  if (!game.done) CLIPS.slice(0, -1).forEach(c => { const t = el('div', 'tick'); t.style.left = (c / 16 * 100) + '%'; tr.appendChild(t); });
  $('#unl').style.width = (L / scale * 100) + '%';
  $('#prog').style.width = '0';
  $('#tMax').textContent = fmt(scale);
  $('#tNow').textContent = '0:00';
  // guess area
  $('#guessArea').hidden = game.done;
  const next = CLIPS[game.guesses.length + 1];
  $('#skip').textContent = game.guesses.length >= MAXT - 1 ? 'Give up' : `Skip (+${next - CLIPS[game.guesses.length]}s)`;
  renderEnd();
}

function renderEnd() {
  const box = $('#end');
  if (!game.done) { box.hidden = true; return; }
  box.hidden = false;
  const n = game.guesses.length;
  box.innerHTML = `<div class="endcard ${game.won ? 'won' : 'lost'}">
    ${track.art ? `<img src="${esc(track.art)}" alt="">` : ''}
    <div><h2>${game.won ? (n === 1 ? 'First second! 🔥' : `Got it on try ${n}!`) : 'Not this time'}</h2>
    <h3>${esc(answer.title)}</h3><p>${esc(answer.artist)}${track.year ? ' · ' + track.year : ''}</p>
    <div class="btns"><button class="primary" id="shareBtn">Copy result</button>
    ${game.mode === 'unlimited' ? '<button id="nextBtn">Next song →</button>' : ''}
    ${track.url ? `<a href="${esc(track.url)}" target="_blank">Open in Apple Music</a>` : ''}</div>
    <p style="margin-top:10px">Press ▶ to hear the full preview.</p></div></div>`;
  $('#shareBtn').onclick = () => copy(shareText());
  if ($('#nextBtn')) $('#nextBtn').onclick = () => startUnlimited(true);
}

function addGuess(g) {
  game.guesses.push(g);
  if (g.type === 'correct') { game.done = true; game.won = true; }
  else if (game.guesses.length >= MAXT) game.done = true;
  save();
  if (game.done && game.mode === 'daily') recordStat();
  stopAudio(); render();
  if (game.done) setTimeout(() => playClip(), 300);
}
function submit() {
  if (!game || game.done) return;
  let s = selected;
  if (!s) { const m = matches($('#q').value); if (m.length === 1 || (m.length && norm($('#q').value).length > 3)) s = m[0]; }
  if (!s) { toast('Pick a song from the list'); return; }
  if (game.guesses.some(g => g.key === songKey(s))) { toast('Already guessed that one'); return; }
  const label = `${s.artist} — ${s.title}`;
  let type = 'wrong';
  if (songKey(s) === songKey(answer)) type = 'correct';
  else if (artistParts(s.artist).some(p => artistParts(answer.artist).includes(p))) type = 'artist';
  $('#q').value = ''; selected = null; $('#drop').hidden = true;
  addGuess({ type, label, key: songKey(s) });
}
$('#submit').onclick = submit;
$('#skip').onclick = () => { if (game && !game.done) addGuess({ type: 'skip' }); };

// ---------- audio ----------
let raf = null, playing = false;
function stopAudio() { au.pause(); playing = false; cancelAnimationFrame(raf); $('#play').textContent = '▶'; $('#prog').style.width = '0'; $('#tNow').textContent = '0:00'; }
async function playClip() {
  if (!track) return;
  if (playing) { stopAudio(); return; }
  try { au.currentTime = 0; await au.play(); } catch (e) { toast('Tap ▶ to play'); return; }
  playing = true; $('#play').textContent = '■';
  const L = limit(), scale = game.done ? 30 : 16;
  const tick = () => {
    const t = au.currentTime;
    $('#prog').style.width = Math.min(100, t / scale * 100) + '%';
    $('#tNow').textContent = fmt(t);
    if (t >= L || au.ended) { stopAudio(); return; }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
$('#play').onclick = playClip;

// ---------- search (local, from the song pool) ----------
let results = [], sel = 0;
function matches(v) {
  const toks = norm(v).split(' ').filter(Boolean); if (!toks.length) return [];
  return POOL.filter(s => { const h = norm(s.title) + ' ' + norm(s.artist); return toks.every(t => h.includes(t)); }).slice(0, 8);
}
const q = $('#q'), drop = $('#drop');
q.addEventListener('input', () => { selected = null; results = matches(q.value); sel = 0; renderDrop(); });
function renderDrop() {
  if (!q.value.trim()) { drop.hidden = true; return; }
  drop.innerHTML = results.length ? results.map((s, i) => `<div class="opt ${i === sel ? 'sel' : ''}" data-i="${i}">${esc(s.title)} <small>— ${esc(s.artist)}</small></div>`).join('') : '<div class="opt"><small>No matches in the song list</small></div>';
  drop.hidden = false;
  drop.querySelectorAll('.opt[data-i]').forEach(o => o.onmousedown = e => { e.preventDefault(); choose(+o.dataset.i); });
}
function choose(i) { const s = results[i]; if (!s) return; selected = s; q.value = `${s.artist} — ${s.title}`; drop.hidden = true; }
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (!drop.hidden && results.length && !selected) choose(sel); else submit(); return; }
  if (drop.hidden || !results.length) return;
  if (e.key === 'ArrowDown') { sel = (sel + 1) % results.length; renderDrop(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = (sel - 1 + results.length) % results.length; renderDrop(); e.preventDefault(); }
  else if (e.key === 'Escape') drop.hidden = true;
});
q.addEventListener('blur', () => setTimeout(() => drop.hidden = true, 150));

// ---------- share / stats ----------
function shareText() {
  const sq = { skip: '⬛', wrong: '🟥', artist: '🟨', correct: '🟩' };
  const row = Array.from({ length: MAXT }, (_, i) => game.guesses[i] ? sq[game.guesses[i].type] : '⬜').join('');
  return `Tune Clue ${game.mode === 'unlimited' ? 'Unlimited' : game.key}\n🔊${row}`;
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = el('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copied!');
}
function recordStat() { const s = LS.get('tc:stats', {}); if (!(game.key in s)) { s[game.key] = game.won ? game.guesses.length : 0; LS.set('tc:stats', s); } }
function openStats() {
  const s = LS.get('tc:stats', {}), v = Object.values(s), played = v.length, wins = v.filter(x => x > 0).length;
  let streak = 0; const d = new Date(); if (!(dateKey(d) in s)) d.setDate(d.getDate() - 1);
  while (s[dateKey(d)] > 0) { streak++; d.setDate(d.getDate() - 1); }
  const dist = Array(MAXT).fill(0); v.forEach(x => { if (x > 0) dist[x - 1]++; }); const mx = Math.max(1, ...dist);
  openModal(`<h2>Stats</h2><div class="stats"><div><b>${played}</b>Played</div><div><b>${played ? Math.round(wins / played * 100) : 0}%</b>Win</div><div><b>${streak}</b>Streak</div></div>
  <div class="help">Solved on try… (daily games)</div>
  ${dist.map((c, i) => `<div class="dist"><span style="width:34px">${CLIPS[i]}s</span><span class="b" style="width:${Math.max(6, c / mx * 100)}%">${c}</span></div>`).join('')}`);
}
function openReplay() {
  const s = LS.get('tc:stats', {}); let h = '<h2>Replay</h2><div class="help">Play any of the last 50 daily songs.</div><div class="days">';
  for (let i = 0; i < 50; i++) {
    const d = new Date(); d.setDate(d.getDate() - i); const k = dateKey(d);
    const st = k in s ? (s[k] > 0 ? `✓ try ${s[k]}` : '✗') : (LS.get('tc:g:' + k, null)?.guesses?.length ? 'in progress' : '—');
    h += `<button data-k="${k}">${i === 0 ? 'Today' : niceDate(k)}<small>${st}</small></button>`;
  }
  openModal(h + '</div>');
  document.querySelectorAll('.days button').forEach(b => b.onclick = () => { closeModal(); startDaily(b.dataset.k); });
}

// ---------- settings / help ----------
function openSettings() {
  openModal(`<h2>Settings</h2>
  <label>Song eras (built-in list, ${BUILTIN.length} songs)</label>
  <div class="checks">${ERAS.map(([k, n]) => `<label><input type="checkbox" value="${k}" ${settings.eras.includes(k) ? 'checked' : ''}>${n}</label>`).join('')}</div>
  <label>Your own song list — one per line as <b>Artist - Title</b></label>
  <textarea id="sCustom" rows="6" placeholder="Queen - Bohemian Rhapsody&#10;Taylor Swift - Shake It Off">${esc(settings.custom)}</textarea>
  <div class="checks" style="margin-top:8px"><label><input type="checkbox" id="sUse" ${settings.useCustom ? 'checked' : ''}>Use only my list</label></div>
  <label>iTunes store country</label><select id="sCountry">${['US', 'CA', 'GB', 'AU', 'IE', 'NZ'].map(c => `<option ${c === settings.country ? 'selected' : ''}>${c}</option>`).join('')}</select>
  <p class="help">Changing the song list changes which song each day picks. Games already in progress for that list keep their song.</p>
  <div class="btns" style="margin-top:12px"><button class="primary" id="sSave">Save</button></div>`);
  $('#sSave').onclick = () => {
    settings.eras = [...document.querySelectorAll('.checks input[value]')].filter(c => c.checked).map(c => c.value);
    settings.custom = $('#sCustom').value; settings.useCustom = $('#sUse').checked; settings.country = $('#sCountry').value;
    LS.set('tc:settings', settings); POOL = getPool(); closeModal();
    toast(`Song pool: ${POOL.length} songs`);
    startDaily(dateKey(new Date()));
  };
}
function openHelp() {
  openModal(`<h2>How to play</h2><div class="help">
  <p>Listen to the clip, then guess the song. You get <b>6 tries</b>.</p>
  <p>The clip starts at 1 second. Each wrong guess or skip unlocks more: 1s → 2s → 4s → 7s → 11s → 16s.</p>
  <p>✗ red = wrong · ≈ gold = right artist, wrong song · ✓ green = correct</p>
  <p>Type to search the song list, pick a match, then Submit (or press Enter twice).</p>
  <p><b>Daily</b> resets at midnight. <b>Replay</b> plays the last 50 days. <b>Unlimited</b> is random songs anytime. Use ⚙ to pick eras or paste your own songs.</p>
  <p>Clips are Apple's 30-second previews, so they usually start mid-song rather than at the very beginning.</p></div>`);
}
function openModal(h) { $('#mbody').innerHTML = h; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
$('#mclose').onclick = closeModal;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
function setNav(id) { document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.id === id)); }
$('#bDaily').onclick = () => startDaily(dateKey(new Date()));
$('#bUnl').onclick = () => startUnlimited(false);
$('#bReplay').onclick = openReplay;
$('#bStats').onclick = openStats;
$('#bHelp').onclick = openHelp;
$('#bSettings').onclick = openSettings;

// ---------- init ----------
(function init() {
  if (!LS.get('tc:seenHelp', false)) { LS.set('tc:seenHelp', true); openHelp(); }
  startDaily(dateKey(new Date())).catch(e => setStatus(e.message));
})();
</script>
</body>
</html>
